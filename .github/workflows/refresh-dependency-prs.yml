name: Refresh Dependency PRs

on:
  pull_request_target:
    branches: [main]
    types: [edited]

permissions: {}

jobs:
  request-rebase:
    uses: use-nyte/.github/.github/workflows/request-dependency-rebase.yml@v1.3.0
    secrets:
      NYTE_AUTOMATION_PRIVATE_KEY: ${{ secrets.NYTE_AUTOMATION_PRIVATE_KEY }}
