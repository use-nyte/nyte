name: Container Images

on:
  repository_dispatch:
    types: [component-main-updated]
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and smoke-test images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      source-tag: ${{ steps.sources.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
          repository: use-nyte/nyte-server
          ref: main
          path: components/nyte-server
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
          repository: use-nyte/nyte-web
          ref: main
          path: components/nyte-web
          persist-credentials: false

      - name: Record source revisions
        id: sources
        run: |
          server="$(git -C components/nyte-server rev-parse HEAD)"
          web="$(git -C components/nyte-web rev-parse HEAD)"
          echo "tag=sha-${GITHUB_SHA}-${server}-${web}" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

      - name: Build all three images
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          SERVER_SHA: ${{ steps.sources.outputs.server }}
          WEB_SHA: ${{ steps.sources.outputs.web }}
        run: |
          for target in nyte-server nyte-web nyte; do
            docker build --secret id=npm_token,env=NODE_AUTH_TOKEN \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "io.nyte.server.revision=${SERVER_SHA}" \
              --label "io.nyte.web.revision=${WEB_SHA}" \
              --target "$target" --tag "$target:baseline" .
          done

      - name: Run image smoke tests
        run: bash packaging/smoke.sh

      - name: Save tested images
        if: github.event_name != 'pull_request'
        run: docker save nyte-server:baseline nyte-web:baseline nyte:baseline | gzip > images.tar.gz

      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: tested-images
          path: images.tar.gz
          retention-days: 1

  publish:
    name: Publish tested images to GHCR
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tested-images

      - name: Load tested images
        run: docker load --input images.tar.gz

      - name: Publish immutable and channel tags
        env:
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ needs.build.outputs.source-tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tags=("${GITHUB_REF_NAME}" latest)
          else
            tags=("$SOURCE_TAG" nightly)
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for image in nyte-server nyte-web nyte; do
            for tag in "${tags[@]}"; do
              ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${tag}"
              docker tag "$image:baseline" "$ref"
              docker push "$ref"
            done
          done
